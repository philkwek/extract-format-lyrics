name: Build and Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build_and_deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Run linter
        run: npm run lint

      - name: Run unit & integration tests
        run: npm test

      - name: Build frontend
        env:
          VITE_ANALYTICS_ENABLED: ${{ vars.VITE_ANALYTICS_ENABLED }}
          VITE_ANALYTICS_HOSTNAMES: ${{ vars.VITE_ANALYTICS_HOSTNAMES }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_PROJECT_ID: extract-format-lyrics
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Build functions (typecheck)
        run: npm run build:functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXTRACT_FORMAT_LYRICS || secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Hosting and Functions
        # `firebase` is the browser SDK dependency, not the Firebase CLI.
        # Pin and invoke the CLI explicitly because GitHub runners do not
        # provide a global Firebase command.
        run: npx --yes firebase-tools@15.33.0 deploy --only hosting,functions,firestore:rules --project extract-format-lyrics --non-interactive
