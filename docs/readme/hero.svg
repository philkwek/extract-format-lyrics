<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Sets &amp; Sheets — chord sheets, setlists and shared lyrics</title>
  <desc id="hero-desc">A warm parchment hero with the Sets &amp; Sheets name and promise, next to a real chord sheet showing chords above lyrics, a setlist tab row, transpose key chips and a share button.</desc>

  <defs>
    <clipPath id="card-clip">
      <rect x="642" y="50" width="500" height="336" rx="20"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="440" rx="28" fill="#F8F6F1"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="27.5" fill="none" stroke="#E8E1D4"/>

  <!-- Brand -->
  <g transform="translate(64 52) scale(0.15625)" fill="#3368A0">
    <path fill-rule="evenodd" d="M 60 20 H 152 V 64 A 20 20 0 0 0 172 84 H 224 V 208 A 28 28 0 0 1 196 236 H 60 A 28 28 0 0 1 32 208 V 48 A 28 28 0 0 1 60 20 Z M 72 58 H 104 A 8 8 0 0 1 112 66 V 78 A 8 8 0 0 1 104 86 H 72 A 8 8 0 0 1 64 78 V 66 A 8 8 0 0 1 72 58 Z M 72 96 H 172 A 8 8 0 0 1 180 104 V 104 A 8 8 0 0 1 172 112 H 72 A 8 8 0 0 1 64 104 V 104 A 8 8 0 0 1 72 96 Z M 72 140 H 104 A 8 8 0 0 1 112 148 V 160 A 8 8 0 0 1 104 168 H 72 A 8 8 0 0 1 64 160 V 148 A 8 8 0 0 1 72 140 Z M 136 140 H 168 A 8 8 0 0 1 176 148 V 160 A 8 8 0 0 1 168 168 H 136 A 8 8 0 0 1 128 160 V 148 A 8 8 0 0 1 136 140 Z M 72 178 H 184 A 8 8 0 0 1 192 186 V 186 A 8 8 0 0 1 184 194 H 72 A 8 8 0 0 1 64 186 V 186 A 8 8 0 0 1 72 178 Z"/>
    <path d="M 168 20 L 224 76 H 176 A 8 8 0 0 1 168 68 V 20 Z"/>
  </g>
  <text x="118" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.4" fill="#1B1916">Sets &amp; Sheets</text>

  <!-- Promise -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#1B1916">
    <text x="64" y="184" font-size="57" font-weight="700" letter-spacing="-1.7">Chords, lyrics</text>
    <text x="64" y="246" font-size="57" font-weight="700" letter-spacing="-1.7">and your setlist.</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20.5" fill="#5F5A50">
    <text x="64" y="304">Paste a chord sheet, change the key, arrange the set,</text>
    <text x="64" y="332">and share it with your group.</text>
  </g>

  <!-- Action line -->
  <text x="64" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="650" fill="#3368A0">setsandsheets.com</text>
  <circle cx="263" cy="385" r="2.5" fill="#B8B2A6"/>
  <text x="280" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17.5" fill="#7A7468">No account needed</text>

  <!-- Proof: a real setlist tab row, chord sheet and transpose controls -->
  <rect x="646" y="58" width="500" height="336" rx="20" fill="#1B1916" opacity="0.06"/>
  <rect x="642" y="50" width="500" height="336" rx="20" fill="#FFFFFF" stroke="#DCE5E1"/>

  <g clip-path="url(#card-clip)">
    <!-- Setlist tabs -->
    <rect x="666" y="72" width="124" height="30" rx="8" fill="#EAF2F8" stroke="#C9DCEA"/>
    <text x="678" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="650" fill="#255283">Here Together</text>
    <text x="802" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#8A857B">A Quiet Prayer</text>
    <text x="1114" y="92" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#A39C8F">2 songs</text>

    <!-- Song heading and key -->
    <text x="666" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.3" fill="#1B1916">Here Together</text>
    <rect x="1010" y="120" width="104" height="26" rx="7" fill="#F6F4EF" stroke="#E7E1D5"/>
    <text x="1062" y="137" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#6E685C">G · Original</text>

    <!-- Section label -->
    <g fill="#B8B2A6">
      <circle cx="668" cy="163" r="1.6"/><circle cx="674" cy="163" r="1.6"/>
      <circle cx="668" cy="169" r="1.6"/><circle cx="674" cy="169" r="1.6"/>
      <circle cx="668" cy="175" r="1.6"/><circle cx="674" cy="175" r="1.6"/>
    </g>
    <text x="686" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.4" fill="#8A857B">VERSE 1</text>

    <!-- Chords above lyrics -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#3368A0">
      <text x="666" y="205">G</text>
      <text x="778" y="205">D/F#</text>
      <text x="890" y="205">Em7</text>
      <text x="1002" y="205">Cadd9</text>

      <text x="666" y="253">G</text>
      <text x="778" y="253">D/F#</text>
      <text x="890" y="253">Em7</text>
      <text x="1002" y="253">Cadd9</text>

      <text x="666" y="301">Em7</text>
      <text x="778" y="301">Cadd9</text>
      <text x="890" y="301">G</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#2B2925">
      <text x="666" y="229">Here together, we bring our song</text>
      <text x="666" y="277">With open hearts, we sing along</text>
      <text x="666" y="325">Give us grace to pause and know</text>
    </g>

    <!-- Controls -->
    <line x1="666" y1="348" x2="1114" y2="348" stroke="#EEE9DF"/>
    <text x="666" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#8A857B">Transpose</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600">
      <rect x="742" y="354" width="26" height="26" rx="7" fill="#F6F4EF"/>
      <text x="755" y="372" text-anchor="middle" fill="#6F6A60">C</text>
      <rect x="774" y="354" width="26" height="26" rx="7" fill="#F6F4EF"/>
      <text x="787" y="372" text-anchor="middle" fill="#6F6A60">D</text>
      <rect x="806" y="354" width="26" height="26" rx="7" fill="#F6F4EF"/>
      <text x="819" y="372" text-anchor="middle" fill="#6F6A60">E</text>
      <rect x="838" y="354" width="26" height="26" rx="7" fill="#3368A0"/>
      <text x="851" y="372" text-anchor="middle" fill="#FFFFFF">G</text>
      <rect x="870" y="354" width="26" height="26" rx="7" fill="#F6F4EF"/>
      <text x="883" y="372" text-anchor="middle" fill="#6F6A60">A</text>
    </g>
    <rect x="1002" y="352" width="112" height="28" rx="7" fill="#3368A0"/>
    <text x="1058" y="371" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#FFFFFF">Share lyrics</text>
  </g>
</svg>
